[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microc-explorer"
version = "1.4.0"
description = "Indexed Micro-C regulatory loop explorer with Streamlit and genomic plots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "matplotlib>=3.9,<4", "pyBigWig>=0.3.24,<0.4", "streamlit>=1.49,<2"]

[project.optional-dependencies]
contact = ["cooler>=0.10.4,<0.11", "hic-straw==1.3.1"]

[project.scripts]
microc-web = "microc_explorer.launch:main"
microc-prepare = "microc_explorer.prepare:main"
microc-index = "microc_explorer.index_db:main"
microc-plot = "microc_explorer.cli:main"

[tool.setuptools.packages.find]
include = ["microc_explorer*"]

[tool.setuptools.package-data]
microc_explorer = ["assets/*.tsv", "assets/*.json", "assets/*.md"]
